<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Optimización de Rutas{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #dde2e8;
      --text: #1f2933;
      --muted: #6b7785;
      --primary: #1a56db;
      --primary-hover: #133e9e;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --success-bg: #ecfdf3;
      --success-text: #027a48;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
    }
    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.8rem; }
    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.25rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    input[type=text], input[type=file], select {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }
    .field { margin-bottom: 1rem; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    a.button-link {
      display: inline-block;
      text-decoration: none;
      background: var(--primary);
      color: #fff;
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      font-size: 1rem;
    }
    a.button-link:hover { background: var(--primary-hover); }
    table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
    .flash {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecdca;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }
    .summary { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .summary div { }
    .summary .value { font-size: 2rem; font-weight: 600; }
    .summary .label { color: var(--muted); font-size: 0.8rem; }
    .badge {
      display: inline-block;
      background: var(--success-bg);
      color: var(--success-text);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
    }
    .muted { color: var(--muted); font-size: 0.8rem; }
    .progress-track {
      width: 100%;
      height: 20px;
      background: #e5eaf0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }
    #lista-progreso {
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .prog-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .prog-row:last-child { border-bottom: none; }
    .prog-index { color: var(--muted); font-weight: 600; min-width: 2.2rem; }
    .prog-nombre { font-weight: 600; flex: 0 0 11rem; min-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prog-coords { flex: 1; color: var(--muted); font-family: monospace; font-size: 0.8rem; }
    .prog-dir { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de Optimización de Rutas de Transporte</h1>
    <p>Ingesta → Normalización IA → Geocodificación → Ruteo óptimo</p>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
